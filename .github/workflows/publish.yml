name: Publish NuGet Packages

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  # Build, test and pack run WITHOUT any publish credential: they execute the test suites and every
  # restored package's build logic, so they must not be able to mint a NuGet key. Only the `publish`
  # job below holds id-token / packages / attestations permissions, and it runs no repository code.
  build:
    # The `create` trigger used to fire on every dependabot branch creation
    # because `on.create` does not support tag/branch filters — that's why
    # this workflow ran with an empty NuGet key on `dependabot/*` branches.
    # Switching to `on.push.tags` covers the tag-release case cleanly. Belt-
    # and-suspenders: also skip the job entirely when run by Dependabot, so
    # any future trigger surprise can't push without secrets.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore dependencies
        run: dotnet restore FlowOrchestrator.slnx

      - name: Build
        run: dotnet build FlowOrchestrator.slnx --no-restore --configuration Release

      - name: Test (Unit)
        run: dotnet test FlowOrchestrator.UnitTests.slnx --no-build --configuration Release --verbosity normal

      - name: Test (Integration)
        run: dotnet test FlowOrchestrator.IntegrationTests.slnx --no-build --configuration Release -p:TargetFramework=net10.0 --verbosity normal

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "version_suffix=" >> $GITHUB_OUTPUT
            echo "version_prefix=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_preview=false" >> $GITHUB_OUTPUT
          else
            PREFIX=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
            # Main builds are pre-releases of the NEXT version (VersionPrefix is bumped right after each
            # release), so they sort above the last stable on nuget.org: 2.0.0-alpha.N > 1.34.1.
            echo "version_suffix=alpha.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "version_prefix=${PREFIX:-0.1.0}" >> $GITHUB_OUTPUT
            echo "is_preview=true" >> $GITHUB_OUTPUT
          fi

      - name: Pack (preview)
        if: steps.version.outputs.is_preview == 'true'
        run: >
          dotnet pack FlowOrchestrator.slnx
          --configuration Release
          --no-build
          --output ./nupkgs
          -p:VersionPrefix=${{ steps.version.outputs.version_prefix }}
          -p:VersionSuffix=${{ steps.version.outputs.version_suffix }}

      - name: Pack (official)
        if: steps.version.outputs.is_preview == 'false'
        run: >
          dotnet pack FlowOrchestrator.slnx
          --configuration Release
          --no-build
          --output ./nupkgs
          -p:VersionPrefix=${{ steps.version.outputs.version_prefix }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Build provenance attestation (Sigstore) for every package pushed.
      attestations: write
      # NuGet.org Trusted Publishing: the job exchanges a GitHub OIDC token for a
      # one-hour NuGet API key, so no long-lived NUGET_API_KEY secret is stored.
      # The same OIDC token signs the provenance attestation.
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: ./nupkgs

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      # Each .nupkg carries an SPDX SBOM (Microsoft.Sbom.Targets, _manifest/spdx_2.2/) and the
      # attestation binds the exact package bytes to this workflow run and commit.
      # `gh attestation verify <pkg>.nupkg -R hoangsnowy/FlowOrchestrator` checks it.
      - name: Attest build provenance
        # Pinned to the v4.2.2 commit: this step signs with the job's OIDC token.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: './nupkgs/*.nupkg'

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GitHub Packages has no symbol server; the .snupkg files go to nuget.org only.
        run: |
          dotnet nuget push "./nupkgs/*.nupkg"             --api-key "$GITHUB_TOKEN"             --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"             --no-symbols             --skip-duplicate

      # Requested right before the push: the temporary key is valid for 1 hour.
      # Needs a Trusted Publishing policy on nuget.org for owner `thelastsnow`,
      # repository hoangsnowy/FlowOrchestrator, workflow file `publish.yml`.
      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        # Pinned to the v1.2.0 commit: this step mints the publish credential, so a moved tag
        # must not be able to change what runs (CodeQL actions/unpinned-tag).
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: thelastsnow   # nuget.org profile name of the package owner, not an email

      # Pushing a .nupkg also pushes the .snupkg beside it to the nuget.org symbol server.
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg"             --api-key "$NUGET_API_KEY"             --source https://api.nuget.org/v3/index.json             --skip-duplicate
